<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>DRK Zugführer Lernapp</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #F4F1ED; font-family: sans-serif; min-height: 100vh; padding: 24px 16px 48px; color: #1A1A1A; }
    button { cursor: pointer; }
    button:focus-visible { outline: 2px solid #C0392B; outline-offset: 2px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes popIn { 0% { transform: scale(0.6); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    @keyframes slideUp { 0% { transform: translateY(14px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }

    /* ── Layout ── */
    .screen { animation: slideUp 0.35s ease; }
    .center { max-width: 720px; margin: 0 auto; }
    .center-sm { max-width: 640px; margin: 0 auto; }
    .center-md { max-width: 600px; margin: 0 auto; }

    /* ── Cards ── */
    .card { background: #fff; border-radius: 16px; border: 1px solid #E0D9D0; padding: 20px 24px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,.07); }
    .card-alt { background: #F9F7F4; border-radius: 12px; border: 1px solid #E0D9D0; padding: 16px 18px; margin-bottom: 14px; }
    .card-goal { border-radius: 12px; padding: 16px 18px; }

    /* ── Typography ── */
    .font-bc { font-family: 'Barlow Condensed', sans-serif; }
    .font-mono { font-family: 'IBM Plex Mono', monospace; }

    /* ── XP Bar ── */
    #xp-bar-wrap { display: flex; align-items: center; gap: 12px; }
    #xp-level { background: #C0392B; color: #fff; border-radius: 6px; padding: 3px 10px; font-size: 12px; font-weight: 700; font-family: 'IBM Plex Mono', monospace; flex-shrink: 0; }
    #xp-track { flex: 1; height: 8px; background: #E0D9D0; border-radius: 4px; overflow: hidden; }
    #xp-fill { height: 100%; background: linear-gradient(90deg, #C0392B, #E74C3C); border-radius: 4px; transition: width .6s ease; }
    #xp-label { font-size: 12px; color: #7A7A7A; font-family: 'IBM Plex Mono', monospace; flex-shrink: 0; }

    /* ── Module Grid ── */
    #module-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
    .mod-card { background: #fff; border: 2px solid #E0D9D0; border-radius: 14px; padding: 18px 16px; text-align: left; transition: all .18s; position: relative; box-shadow: 0 1px 3px rgba(0,0,0,.06); width: 100%; }
    .mod-card:hover { background: #F9F7F4; box-shadow: 0 4px 16px rgba(0,0,0,.10); transform: translateY(-2px); }
    .mod-icon { font-size: 26px; margin-bottom: 8px; }
    .mod-title { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 17px; color: #1A1A1A; margin-bottom: 3px; }
    .mod-sub { font-size: 11px; color: #7A7A7A; font-family: 'IBM Plex Mono', monospace; margin-bottom: 12px; }
    .mod-badge { position: absolute; top: 10px; right: 10px; background: #E8F5EE; color: #1D6A45; border-radius: 12px; padding: 2px 8px; font-size: 11px; font-weight: 700; font-family: 'IBM Plex Mono', monospace; }
    .mod-progress-row { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 4px; font-family: 'IBM Plex Mono', monospace; }
    .mod-bar-track { height: 5px; background: #E0D9D0; border-radius: 3px; }
    .mod-bar-fill { height: 100%; border-radius: 3px; transition: width .5s; }
    .mod-empty { font-size: 11px; color: #C8BFB4; font-family: 'IBM Plex Mono', monospace; }

    /* ── Quiz ── */
    .quiz-header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
    .btn-back { background: #fff; border: 1px solid #E0D9D0; border-radius: 8px; color: #4A4A4A; padding: 7px 14px; font-size: 13px; font-family: 'IBM Plex Mono', monospace; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
    .quiz-title { flex: 1; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 20px; color: #1A1A1A; }
    .quiz-score { display: flex; gap: 12px; font-family: 'IBM Plex Mono', monospace; font-size: 13px; }
    .score-ok { color: #1D6A45; font-weight: 700; }
    .score-err { color: #C0392B; font-weight: 700; }
    .diff-badge { border-radius: 6px; padding: 4px 10px; font-size: 12px; font-family: 'IBM Plex Mono', monospace; font-weight: 700; display: inline-block; margin-bottom: 14px; }
    .q-card { background: #fff; border-radius: 14px; padding: 22px 24px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,.07); border-width: 2px; border-style: solid; }
    .q-text { font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 600; color: #1A1A1A; line-height: 1.45; }
    .options { display: flex; flex-direction: column; gap: 9px; margin-bottom: 20px; }
    .opt-btn { border-width: 2px; border-style: solid; border-radius: 10px; padding: 13px 16px; text-align: left; font-family: 'IBM Plex Mono', monospace; font-size: 13px; transition: all .15s; display: flex; align-items: flex-start; gap: 12px; line-height: 1.5; width: 100%; }
    .opt-label { width: 24px; height: 24px; border-radius: 50%; border-width: 2px; border-style: solid; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 11px; font-weight: 800; margin-top: 1px; }
    .btn-submit { width: 100%; padding: 15px; border: none; border-radius: 10px; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 18px; letter-spacing: 1px; transition: all .2s; }
    .btn-next { width: 100%; padding: 15px; border: none; border-radius: 10px; color: #fff; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 18px; letter-spacing: 1px; cursor: pointer; }
    .xp-pop { text-align: center; margin-bottom: 12px; font-family: 'IBM Plex Mono', monospace; font-weight: 700; font-size: 15px; color: #B45309; animation: popIn .4s ease; }
    .explain-label { font-size: 11px; color: #7A7A7A; font-family: 'IBM Plex Mono', monospace; margin-bottom: 8px; font-weight: 700; }
    .explain-text { color: #4A4A4A; font-size: 14px; line-height: 1.7; font-family: 'IBM Plex Mono', monospace; }

    /* ── Stats ── */
    .stats-header { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
    .stats-title { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 26px; color: #1A1A1A; }
    .stat-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 24px; }
    .stat-box { border: 1px solid #E0D9D0; border-radius: 12px; padding: 16px 12px; text-align: center; }
    .stat-icon { font-size: 24px; margin-bottom: 6px; }
    .stat-val { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 28px; }
    .stat-lbl { font-size: 10px; color: #7A7A7A; font-family: 'IBM Plex Mono', monospace; margin-top: 2px; }
    .mod-stat-row { background: #fff; border: 1px solid #E0D9D0; border-radius: 10px; padding: 12px 16px; margin-bottom: 8px; }
    .mod-stat-top { display: flex; justify-content: space-between; margin-bottom: 7px; }
    .mod-stat-name { font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 15px; color: #1A1A1A; }
    .mod-stat-pct { font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 700; }
    .mod-stat-bar { height: 6px; background: #E0D9D0; border-radius: 3px; }
    .mod-stat-fill { height: 100%; border-radius: 3px; transition: width .5s; }

    /* ── Misc ── */
    .streak-badge { color: #fff; border-radius: 20px; padding: 4px 12px; font-size: 12px; font-family: 'IBM Plex Mono', monospace; font-weight: 700; }
    .btn-stats { background: #F9F7F4; border: 1px solid #E0D9D0; border-radius: 8px; color: #4A4A4A; padding: 7px 14px; font-size: 13px; font-family: 'IBM Plex Mono', monospace; }
    .daily-box { background: #FDECEA; border: 1px solid #E8C5C0; border-radius: 12px; padding: 13px 18px; margin-bottom: 20px; display: flex; align-items: center; gap: 14px; }
    .daily-icon { font-size: 26px; }
    .daily-title { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 16px; color: #C0392B; }
    .daily-sub { font-size: 12px; color: #4A4A4A; margin-top: 2px; font-family: 'IBM Plex Mono', monospace; }
    .section-label { font-size: 10px; color: #7A7A7A; font-family: 'IBM Plex Mono', monospace; letter-spacing: 2px; font-weight: 700; margin-bottom: 12px; }
    .footer { margin-top: 32px; font-size: 10px; color: #7A7A7A; text-align: center; font-family: 'IBM Plex Mono', monospace; }
    .goal-label { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #7A7A7A; margin-bottom: 6px; }
    .goal-text { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 18px; }
    .overall-pct { margin-top: 12px; font-size: 12px; font-family: 'IBM Plex Mono', monospace; }
  </style>
</head>

<div id="app"></div>

<script>
// ══════════════════════════════════════════════════════════════
// DATEN
// ══════════════════════════════════════════════════════════════
const STORAGE_KEY = "drk_zugfuehrer_v3";

const MODULES = [
  { id:"fuehrungsvorgang", title:"Führungsvorgang",      subtitle:"DV 100 · Führungskreislauf",      icon:"⚙️", accent:"#C0392B" },
  { id:"einsatzbefehl",   title:"Einsatzbefehl",        subtitle:"FERN-Schema · Befehlsarten",      icon:"📋", accent:"#1E4D8C" },
  { id:"taktik",          title:"Taktik & Einheiten",   subtitle:"SEG · EE · Führungsebenen",       icon:"🗂️", accent:"#1A5276" },
  { id:"lagekarte",       title:"Lagekarte & ETB",      subtitle:"DV 102 · Taktische Zeichen",      icon:"🗺️", accent:"#6C3483" },
  { id:"manv",            title:"MANV & Sichtung",      subtitle:"Sichtungskategorien · BHP",       icon:"🏥", accent:"#1D6A45" },
  { id:"recht",           title:"Recht & Organisation", subtitle:"Rechtsgrundlagen · DRK-Struktur", icon:"⚖️", accent:"#7D6608" },
  { id:"funk",            title:"Funk & Kommunikation", subtitle:"BOS-Funk · Digitalfunk TETRA",    icon:"📻", accent:"#784212" },
  { id:"sanitaet",        title:"Sanitätsdienst",       subtitle:"DV 400 · Medizinische Leitung",   icon:"🩺", accent:"#1F618D" },
];

const QB = {
  fuehrungsvorgang: [
    { frage:"In welcher Reihenfolge laufen die Phasen des Führungsvorgangs nach DV 100 ab?", optionen:["Befehl → Erkundung → Entschluss → Kontrolle","Erkundung → Beurteilung → Entschluss → Befehl → Kontrolle","Planung → Befehl → Rückmeldung → Analyse","Lagebeurteilung → Planung → Durchführung → Bewertung"], richtig:1, erklaerung:"Der Führungsvorgang nach DV 100 ist zyklisch: Erkundung → Beurteilung → Entschluss → Befehl → Kontrolle. Danach beginnt der Kreislauf erneut.", schwierigkeit:"leicht" },
    { frage:"Was ist die Aufgabe der 'Beurteilung der Lage'?", optionen:["Den Befehl schriftlich festhalten","Auftrag, eigene Kräfte, Schadenslage und Handlungsoptionen analysieren","Die Einsatzkräfte einweisen","Den Einsatz beenden und dokumentieren"], richtig:1, erklaerung:"In der Beurteilungsphase analysiert die Führungskraft: Auftrag, eigene Lage (Kräfte, Mittel, Zeit), Schadenslage und Handlungsoptionen. Daraus leitet sie den Entschluss ab.", schwierigkeit:"leicht" },
    { frage:"Dürfen Führungsebenen nach DV 100 übersprungen werden?", optionen:["Ja, immer erlaubt","Grundsätzlich nein — nur in Ausnahmefällen mit unverzüglicher Nachricht","Ja, bei mehr als 3 Verletzten","Nur der Einsatzleiter darf das entscheiden"], richtig:1, erklaerung:"Führungsebenen dürfen grundsätzlich NICHT übersprungen werden. In eilbedürftigen Ausnahmefällen ist es möglich, jedoch muss die übersprungene Stelle unverzüglich informiert werden.", schwierigkeit:"mittel" },
    { frage:"Was bedeutet 'Kontrolle' im Führungsvorgang nach DV 100?", optionen:["Fahrzeugüberprüfung vor dem Einsatz","Qualitätsprüfung des Materials","Laufende Überprüfung ob Befehle verstanden, weitergegeben und ausgeführt werden","Personalüberprüfung der Mannschaft"], richtig:2, erklaerung:"Kontrolle: ständiges Überprüfen ob Befehle richtig verstanden, weitergegeben und umgesetzt werden. Sie liefert Informationen für den nächsten Führungszyklus.", schwierigkeit:"mittel" },
    { frage:"Auf welcher Führungsebene agiert der Zugführer nach DV 100?", optionen:["Truppebene","Gruppenebene","Zugebene","Verbandsebene"], richtig:2, erklaerung:"Der Zugführer agiert auf der Zugebene (Führungsstufe B). Er führt mehrere Gruppen, in der Regel abgesetzt vom direkten Einsatzort.", schwierigkeit:"leicht" },
    { frage:"Wie viele taktische Einheiten sollen einer Führungsebene maximal unterstellt sein?", optionen:["Maximal 2","Maximal 3–5","Maximal 8","Unbegrenzt"], richtig:1, erklaerung:"Nach DV 100 sollen einer Führungsebene nicht mehr als 3 bis 5 taktische Teileinheiten unterstellt sein, um eine effektive Führungsspanne zu gewährleisten.", schwierigkeit:"mittel" },
    { frage:"Was versteht man unter dem 'Entschluss' im Führungsvorgang?", optionen:["Der unterzeichnete Einsatzbefehl","Die Entscheidung der Führungskraft wie der Auftrag erfüllt werden soll","Der Beschluss des Kreisbereitschaftsleiters","Die Zusammenfassung des Einsatzberichts"], richtig:1, erklaerung:"Der Entschluss ist die zentrale Entscheidung, mit welchen Mitteln und auf welchem Weg der Auftrag erfüllt wird. Er ist Grundlage für die Befehlsausgabe.", schwierigkeit:"leicht" },
    { frage:"Was versteht man unter 'abgesetzter Führung' auf Zugebene?", optionen:["Der Zugführer befindet sich direkt bei den Verletzten","Der Zugführer führt von einem rückwärtigen Führungsstandort, nicht vom Schadensort","Die Führung erfolgt ausschließlich per Funk","Der Zugführer übergibt die Führung an den Gruppenführer"], richtig:1, erklaerung:"Abgesetzte Führung: der Zugführer führt von einem Standort (z.B. KdoW) aus — nicht direkt am Schadensort. So behält er Übersicht und kann ruhig beurteilen.", schwierigkeit:"mittel" },
  ],
  einsatzbefehl: [
    { frage:"Wofür steht das Kürzel FERN im DRK-Einsatzbefehl?", optionen:["Führung – Erkundung – Rückmeldung – Nachalarmierung","Fakten – Einheiten – Ressourcen – Normen","Feuer – Einsatz – Rettung – Nothilfe","Führungskraft – Ergebnis – Regelung – Notfall"], richtig:0, erklaerung:"FERN: F=Führung (Führungsstelle, Funk), E=Erkundung (Lage, Auftrag), R=Rückmeldung (Kommunikationswege), N=Nachalarmierung. Das Schema strukturiert die Befehlsausgabe auf Zugführerebene.", schwierigkeit:"leicht" },
    { frage:"Was enthält der Befehlspunkt 'Führung' im FERN-Schema?", optionen:["Sanitätsplan und Medikamentenliste","Standort der Führungsstelle und Funkkanal","Liste aller eingesetzten Fahrzeuge","Ablaufplan der medizinischen Maßnahmen"], richtig:1, erklaerung:"Unter 'Führung' werden Standort der Führungsstelle (KdoW, ELW), Verbindungsmittel und Funkkanal festgelegt. Damit weiß jede Einheit, wo und wie sie melden soll.", schwierigkeit:"mittel" },
    { frage:"Welche Befehlsart lässt dem Unterführer den größten Handlungsspielraum?", optionen:["Einzelbefehl","Auftragsbefehl (Auftragstaktik)","Grundbefehl","Sofortbefehl"], richtig:1, erklaerung:"Der Auftragsbefehl beschreibt das Ziel, überlässt aber dem Unterführer die Wahl der Mittel. Er fördert Eigenverantwortung und ist bei unübersichtlicher Lage besonders geeignet.", schwierigkeit:"mittel" },
    { frage:"Was beschreibt der Befehlspunkt 'Erkundung' im FERN-Schema?", optionen:["Welche Einheiten nachalarmiert werden sollen","Die aktuelle Schadenslage und den erhaltenen Auftrag","Die Funkdisziplin im Einsatz","Die Personalstärke der eingesetzten Gruppen"], richtig:1, erklaerung:"Unter 'Erkundung' wird die aktuelle Lage (Schadensumfang, Gefahren, Patientenzahlen) und der erhaltene Auftrag beschrieben — die Lagebeschreibung für unterstellte Gruppenführer.", schwierigkeit:"mittel" },
    { frage:"Wie soll ein Befehl nach DV 100 formuliert sein?", optionen:["So ausführlich wie möglich mit allen Details","Kurz und klar – enthält nur was Unterführer zur Auftragserfüllung wissen müssen","Immer schriftlich und vom Zugführer unterschrieben","Standardisiert nach festem Wortlaut ohne Abweichungen"], richtig:1, erklaerung:"Nach DV 100 soll ein Befehl kurz, klar und präzise sein — alles, aber auch nur das, was die nachgeordneten Führungskräfte wissen müssen.", schwierigkeit:"leicht" },
    { frage:"Was ist der Unterschied zwischen Einzel- und Gruppenbefehl?", optionen:["Beim Einzelbefehl handelt es sich um einen mündlichen Befehl","Einzelbefehl an eine Einheit, Gruppenbefehl gleichzeitig an alle","Gruppenbefehl ist immer schriftlich","Es gibt keinen Unterschied"], richtig:1, erklaerung:"Der Einzelbefehl richtet sich an eine Einheit mit individuellen Aufgaben. Der Gruppenbefehl wird gleichzeitig an alle unterstellten Einheiten erteilt.", schwierigkeit:"schwer" },
    { frage:"Welche Information gehört in den Befehlspunkt 'Nachalarmierung'?", optionen:["Einsatzende und Abzugsreihenfolge","Regelungen zur Anforderung von Verstärkung oder Spezialkräften","Personalausweis-Nummern der Eingesetzten","Materialbestand nach dem Einsatz"], richtig:1, erklaerung:"Unter 'Nachalarmierung' werden Regelungen getroffen, wie zusätzliche Kräfte oder Spezialmittel angefordert werden können (weitere SEGs, LNA, OrgL, etc.).", schwierigkeit:"mittel" },
    { frage:"Was versteht man unter 'Befehlsgebung in der Kürze'?", optionen:["Befehle werden nur per SMS erteilt","Nur der wichtigste Satz wird mitgeteilt","Befehle ohne Umschweife erteilt — effizient und präzise","Befehle müssen kürzer als 30 Sekunden sein"], richtig:2, erklaerung:"Befehlsgebung in der Kürze: klare, unmissverständliche Formulierung ohne unnötige Füllwörter. In Stresssituationen ist ein präziser Befehl effektiver als langer Erklärungstext.", schwierigkeit:"leicht" },
  ],
  taktik: [
    { frage:"Wie viele Personen umfasst eine DRK-Einsatzeinheit (ohne TeSi) in BW?", optionen:["15 Personen","20 Personen","28 Personen","40 Personen"], richtig:2, erklaerung:"Eine DRK-EE ohne TeSi hat in BW eine Stärke von 3/2/23/28 inkl. 7 KFZ. Sie besteht aus Führungstrupp, SEG-Sanität, SEG-Transport und SEG-Betreuung.", schwierigkeit:"mittel" },
    { frage:"Welche Aufgabe hat der Führungstrupp der DRK-Einsatzeinheit?", optionen:["Selbständige Patientenversorgung","Koordination der SEGs und Verbindungshalten zur übergeordneten Einsatzleitung","Aufbau des Behandlungsplatzes","Technische Unterstützung und Materiallogistik"], richtig:1, erklaerung:"Der Führungstrupp (ZFü, stv. ZFü, Zugarzt, GrFü, FüHe) koordiniert die unterstellten SEGs und hält Verbindung zur TEL bzw. übergeordneten Führungsstelle.", schwierigkeit:"leicht" },
    { frage:"Wie viele Verletzte kann eine SEG-Sanität im Regelfall versorgen?", optionen:["5","10","20","50"], richtig:2, erklaerung:"Eine SEG-Sanität kann i.d.R. 20 Verletzte selbstständig erstversorgen. Bei größeren Lagen arbeitet sie im Verbund mehrerer SEGs am Behandlungsplatz.", schwierigkeit:"leicht" },
    { frage:"Aus welchen Komponenten besteht eine SEG-Transport?", optionen:["2 RTW und 8 Helfer","4 Helfer und 2 KTW (KTW-B oder KTW-4)","1 NAW und 4 Helfer","6 Helfer und 1 GW-San"], richtig:1, erklaerung:"Die SEG-Transport besteht aus 4 Helfern und 2 KTW. Ihre Aufgabe: Verstärkung des Rettungsdienstes und Patiententransport beim MANV.", schwierigkeit:"mittel" },
    { frage:"Was ist eine SEG (Schnelleinsatzgruppe)?", optionen:["Eine ständig besetzte Einsatzzentrale","Eine kleine, schnell einsetzbare Einheit unterhalb der Einsatzeinheit","Ein Spezialtransportfahrzeug","Eine Spezialeinheit für Großschadenlagen"], richtig:1, erklaerung:"Eine SEG ist eine kleine, schnell alarmierbare taktische Einheit. Sie kann als Teil der EE oder selbstständig eingesetzt werden.", schwierigkeit:"leicht" },
    { frage:"Wer trägt die Gesamtverantwortung für die Sicherheit der Helfer im Zug?", optionen:["Der Gruppenführer","Der Zugarzt","Der Zugführer","Der Kreisbereitschaftsleiter"], richtig:2, erklaerung:"Der Zugführer ist für die Sicherheit aller Helfer seines Zuges verantwortlich. Er muss Gefahren erkennen, Schutzmaßnahmen einleiten und die Sicherheit laufend im Blick behalten.", schwierigkeit:"mittel" },
    { frage:"Was ist der Unterschied zwischen Einsatzeinheit (EE) und SEG?", optionen:["Es gibt keinen Unterschied","EE ist größer und umfasst mehrere SEGs plus Führungstrupp","SEG ist die ältere Bezeichnung für EE","EE wird nur im Katastrophenfall eingesetzt"], richtig:1, erklaerung:"Die EE ist die übergeordnete Einheit und umfasst mehrere SEGs plus Führungstrupp. Eine SEG kann auch eigenständig eingesetzt werden.", schwierigkeit:"leicht" },
    { frage:"Für welchen Einsatz ist eine SEG-Betreuung vorgesehen?", optionen:["Medizinische Erstversorgung Schwerverletzter","Betreuung und Versorgung unverletzter Betroffener (z.B. Evakuierte, Angehörige)","Transport von Intensivpatienten","Dekontamination von Verletzten"], richtig:1, erklaerung:"Die SEG-Betreuung kümmert sich um psychische Unterstützung und Grundversorgung (Unterkunft, Verpflegung) von unverletzten oder leicht betroffenen Personen.", schwierigkeit:"mittel" },

let state = {
  screen: "home",   // "home" | "quiz" | "stats"
  activeModule: null,
  xp: 0,
  streak: 0,
  moduleStats: {},       // { moduleId: { total, correct } }
  sessionCorrect: 0,
  sessionWrong: 0,
  // quiz state
  question: null,
  selected: null,
  answered: false,
  usedIdx: [],
  xpGained: null,
};

function loadSaved() {
  try {
    const r = localStorage.getItem(STORAGE_KEY);
    if (r) {
      const s = JSON.parse(r);
      state.xp = s.xp || 0;
      state.streak = s.streak || 0;
      state.moduleStats = s.moduleStats || {};
    }
  } catch(e) {}
}

function saveSaved() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      xp: state.xp,
      streak: state.streak,
      moduleStats: state.moduleStats,
    }));
  } catch(e) {}
}

// HELPERS
// ══════════════════════════════════════════════════════════════
function calcLevel(xp) { return Math.floor(Math.sqrt(xp / 50)) + 1; }
function xpForNext(level) { return level * level * 50; }
function xpGainFn(ok, diff) {
  if (!ok) return 0;
  return diff === "schwer" ? 30 : diff === "mittel" ? 20 : 10;
}

function getLocalQuestion(moduleId, usedIdx) {
  const bank = QB[moduleId] || QB.fuehrungsvorgang;
  const avail = bank.map((_, i) => i).filter(i => !usedIdx.includes(i));
  const pool = avail.length > 0 ? avail : bank.map((_, i) => i);
  const idx = pool[Math.floor(Math.random() * pool.length)];
  return { q: bank[idx], idx };
}

function overallPct() {
  const vals = Object.values(state.moduleStats);
  const t = vals.reduce((s, m) => s + (m.total || 0), 0);
  const c = vals.reduce((s, m) => s + (m.correct || 0), 0);
  return t > 0 ? Math.round((c / t) * 100) : 0;
}

// RENDER
// ══════════════════════════════════════════════════════════════
function el(tag, attrs, ...children) {
  const e = document.createElement(tag);
  if (attrs) {
    for (const [k, v] of Object.entries(attrs)) {
      if (k === "class") e.className = v;
      else if (k.startsWith("on")) e.addEventListener(k.slice(2).toLowerCase(), v);
      else if (k === "style" && typeof v === "object") Object.assign(e.style, v);
      else if (k === "disabled") { if (v) e.disabled = true; }
      else e.setAttribute(k, v);
    }
  }
  for (const child of children.flat()) {
    if (child == null || child === false) continue;
    e.appendChild(typeof child === "string" ? document.createTextNode(child) : child);
  }
  return e;
}

function render() {
  const app = document.getElementById("app");
  app.innerHTML = "";
  if (state.screen === "home") app.appendChild(renderHome());
  else if (state.screen === "quiz") app.appendChild(renderQuiz());
  else if (state.screen === "stats") app.appendChild(renderStats());
}

// ── HOME ──────────────────────────────────────────────────────

  const level = calcLevel(state.xp);
  const prev = (level - 1) ** 2 * 50;
  const next = xpForNext(level);
  const pct = Math.min(100, ((state.xp - prev) / (next - prev)) * 100);
  const op = overallPct();

  const streakBadge = state.streak >= 2
    ? el("div", { class: "streak-badge", style: { background: state.streak >= 5 ? "#C0392B" : "#B45309" } },

    el("div", {},
      el("div", { class: "daily-title" }, "TÄGLICHE LERNEINHEIT"),
      el("div", { class: "daily-sub" }, "Wähle ein Modul und meistere 5 Fragen — reicht für heute!")));

  const label = el("div", { class: "section-label" }, "MODULE — 64 FRAGEN · 8 THEMENGEBIETE");

  const grid = el("div", { id: "module-grid" });
  for (const mod of MODULES) {
    grid.appendChild(renderModCard(mod));
  }

  const footer = el("div", { class: "footer" },
    "DV 100 · DV 102 · DV 400 · KatS-Gesetz BW · DRK-Landesschule Pfalzgrafenweiler 2025");

  return el("div", { class: "screen center" }, header, daily, label, grid, footer);
}

function renderModCard(mod) {
  const ms = state.moduleStats[mod.id] || {};
  const total = ms.total || 0, correct = ms.correct || 0;
  const pct = total > 0 ? Math.round((correct / total) * 100) : null;
  const mastered = pct !== null && pct >= 80;
  const barColor = pct >= 80 ? "#1D6A45" : pct >= 60 ? "#B45309" : "#C0392B";

  const card = el("button", {
    class: "mod-card",
    onClick: () => startModule(mod),
    onMouseover: () => { card.style.borderColor = mod.accent; },
    onMouseout: () => { card.style.borderColor = mastered ? mod.accent : "#E0D9D0"; },
    style: { borderColor: mastered ? mod.accent : "#E0D9D0" }
  },
    mastered ? el("div", { class: "mod-badge" }, "✓ Gemeistert") : null,
    el("div", { class: "mod-icon" }, mod.icon),
    el("div", { class: "mod-title" }, mod.title),
    el("div", { class: "mod-sub" }, mod.subtitle),
    pct !== null
      ? el("div", {},
          el("div", { class: "mod-progress-row" },
            el("span", { style: { color: "#7A7A7A" } }, correct + "/" + total + " richtig"),
            el("span", { style: { color: barColor, fontWeight: 700 } }, pct + "%")),
          el("div", { class: "mod-bar-track" },
            el("div", { class: "mod-bar-fill", style: { width: pct + "%", background: barColor } })))
      : el("div", { class: "mod-empty" }, "Noch nicht gestartet")
  );
  return card;
}

function startModule(mod) {
  state.activeModule = mod;
  state.sessionCorrect = 0;
  state.sessionWrong = 0;
  state.usedIdx = [];
  state.screen = "quiz";
  loadNextQuestion();
  render();
}

// ── QUIZ ──────────────────────────────────────────────────────
function loadNextQuestion() {
  const { q, idx } = getLocalQuestion(state.activeModule.id, state.usedIdx);
  state.question = q;
  if (idx >= 0) state.usedIdx.push(idx);
  state.selected = null;
  state.answered = false;
  state.xpGained = null;
}

function renderQuiz() {
  const mod = state.activeModule;
  const q = state.question;

  const diffMap = {
    leicht: { label: "Leicht", bg: "#E8F5EE", col: "#1D6A45" },
    mittel: { label: "Mittel", bg: "#FEF3C7", col: "#B45309" },
    schwer: { label: "Schwer", bg: "#FDECEA", col: "#C0392B" },
  };
  const d = diffMap[q.schwierigkeit] || diffMap.leicht;

  const header = el("div", { class: "quiz-header" },
    el("button", { class: "btn-back", onClick: () => { state.screen = "home"; render(); } }, "← Zurück"),
    el("div", { class: "quiz-title" }, mod.icon + " " + mod.title),
    el("div", { class: "quiz-score" },
      el("span", { class: "score-ok" }, "✓ " + state.sessionCorrect),
      el("span", { class: "score-err" }, "✗ " + state.sessionWrong)));

  const diffBadge = el("div", {},
    el("span", { class: "diff-badge", style: { background: d.bg, color: d.col } }, d.label));

  const qCard = el("div", { class: "q-card", style: { borderColor: mod.accent } },
    el("div", { class: "q-text" }, q.frage));

  const optionsWrap = el("div", { class: "options" });
  q.optionen.forEach((opt, i) => {
    const isSel = state.selected === i;
    const isCorrect = q.richtig === i;

    let bg = "#FFFFFF", borderCol = "#E0D9D0", textCol = "#4A4A4A", lblBg = "#F9F7F4", lblCol = "#7A7A7A";
    if (state.answered) {
      if (isCorrect) { bg = "#E8F5EE"; borderCol = "#1D6A45"; textCol = "#1D6A45"; lblBg = "#1D6A45"; lblCol = "#fff"; }
      else if (isSel) { bg = "#FDECEA"; borderCol = "#C0392B"; textCol = "#C0392B"; lblBg = "#C0392B"; lblCol = "#fff"; }
    } else if (isSel) {
      bg = "#EBF2FB"; borderCol = "#1E4D8C"; textCol = "#1E4D8C"; lblBg = "#1E4D8C"; lblCol = "#fff";
    }

    const labelText = state.answered && isCorrect ? "✓"
      : state.answered && isSel && !isCorrect ? "✗"
      : String.fromCharCode(65 + i);

    const btn = el("button", {
      class: "opt-btn",
      style: { background: bg, borderColor: borderCol, color: textCol, cursor: state.answered ? "default" : "pointer" },
      onClick: () => {
        if (state.answered) return;
        state.selected = i;
        render();
      }
    },
      el("span", { class: "opt-label", style: { background: lblBg, color: lblCol, borderColor: borderCol } }, labelText),
      el("span", { style: { flex: 1 } }, opt));
    optionsWrap.appendChild(btn);
  });

  let actionArea;
  if (!state.answered) {
    const canSubmit = state.selected !== null;
    actionArea = el("button", {
      class: "btn-submit",
      style: {
        background: canSubmit ? mod.accent : "#E0D9D0",
        color: canSubmit ? "#fff" : "#7A7A7A",
        cursor: canSubmit ? "pointer" : "not-allowed",
        boxShadow: canSubmit ? "0 2px 8px rgba(0,0,0,.15)" : "none",
      },
      disabled: !canSubmit,
      onClick: () => {
        if (state.selected === null) return;
        const ok = q.richtig === state.selected;
        const gained = xpGainFn(ok, q.schwierigkeit);
        state.answered = true;
        state.xpGained = gained;
        state.xp += gained;
        state.streak = ok ? state.streak + 1 : 0;
        if (ok) state.sessionCorrect++; else state.sessionWrong++;
        const ms = state.moduleStats[mod.id] || { total: 0, correct: 0 };
        state.moduleStats[mod.id] = { total: ms.total + 1, correct: ms.correct + (ok ? 1 : 0) };
        saveSaved();
        render();
      }
    }, "ANTWORT PRÜFEN");
  } else {
    const xpPop = state.xpGained > 0
      ? el("div", { class: "xp-pop" }, "+" + state.xpGained + " XP ⚡")
      : null;
    const explain = el("div", { class: "card-alt" },
      el("div", { class: "explain-label" }, "💡 ERKLÄRUNG"),
      el("div", { class: "explain-text" }, q.erklaerung));
    const nextBtn = el("button", {
      class: "btn-next",
      style: { background: mod.accent },
      onClick: () => { loadNextQuestion(); render(); }
    }, "NÄCHSTE FRAGE →");
    actionArea = el("div", {}, xpPop, explain, nextBtn);
  }

  return el("div", { class: "screen center-sm" }, header, diffBadge, qCard, optionsWrap, actionArea);
}

// ── STATS ─────────────────────────────────────────────────────
function renderStats() {
  const vals = Object.values(state.moduleStats);
  const totalQ = vals.reduce((s, m) => s + (m.total || 0), 0);
  const totalC = vals.reduce((s, m) => s + (m.correct || 0), 0);
  const pct = totalQ > 0 ? Math.round((totalC / totalQ) * 100) : 0;

  const header = el("div", { class: "stats-header" },
    el("button", { class: "btn-back", onClick: () => { state.screen = "home"; render(); } }, "← Zurück"),
    el("div", { class: "stats-title font-bc" }, "Lernstatistik"));

  const statGrid = el("div", { class: "stat-grid" });
  [
    { label: "Fragen gesamt", val: totalQ, icon: "📊", bg: "#EBF2FB", col: "#1E4D8C" },
    { label: "Trefferquote", val: pct + "%", icon: "🎯", bg: pct >= 80 ? "#E8F5EE" : "#FEF3C7", col: pct >= 80 ? "#1D6A45" : "#B45309" },
    { label: "Aktuelle Serie", val: state.streak, icon: "🔥", bg: state.streak >= 5 ? "#FDECEA" : "#F9F7F4", col: state.streak >= 5 ? "#C0392B" : "#4A4A4A" },
  ].forEach(s => {
    statGrid.appendChild(el("div", { class: "stat-box", style: { background: s.bg } },
      el("div", { class: "stat-icon" }, s.icon),
      el("div", { class: "stat-val font-bc", style: { color: s.col } }, String(s.val)),
      el("div", { class: "stat-lbl font-mono" }, s.label)));
  });

  const modLabel = el("div", { class: "section-label", style: { marginTop: "8px" } }, "FORTSCHRITT PRO MODUL");
  const modRows = el("div", {});
  for (const m of MODULES) {
    const ms = state.moduleStats[m.id] || {};
    const p = ms.total > 0 ? Math.round((ms.correct / ms.total) * 100) : 0;
    const bc = p >= 80 ? "#1D6A45" : p >= 60 ? "#B45309" : "#C0392B";
    modRows.appendChild(el("div", { class: "mod-stat-row" },
      el("div", { class: "mod-stat-top" },
        el("span", { class: "mod-stat-name font-bc" }, m.icon + " " + m.title),
        el("span", { class: "mod-stat-pct font-mono", style: { color: ms.total > 0 ? bc : "#7A7A7A" } },
          ms.total > 0 ? ms.correct + "/" + ms.total + " · " + p + "%" : "—")),
      el("div", { class: "mod-stat-bar" },
        el("div", { class: "mod-stat-fill", style: { width: p + "%", background: bc } }))));
  }

  const goalColor = pct >= 80 ? "#1D6A45" : "#C0392B";
  const goalBg = pct >= 80 ? "#E8F5EE" : "#FDECEA";
  const goalBorder = pct >= 80 ? "#1D6A45" : "#E8C5C0";
  const goal = el("div", { class: "card-goal", style: { background: goalBg, border: "1px solid " + goalBorder, marginTop: "16px" } },
    el("div", { class: "goal-label font-mono" }, "🎯 PRÜFUNGSZIEL: 80%"),
    el("div", { class: "goal-text font-bc", style: { color: goalColor } },
      pct >= 80 ? "✅ Ziel erreicht! Weiter so!" : "Noch " + (80 - pct) + " Prozentpunkte bis zum Ziel."));

  return el("div", { class: "screen center-md" }, header, statGrid, modLabel, modRows, goal);
}

// ══════════════════════════════════════════════════════════════
// START
// ══════════════════════════════════════════════════════════════
loadSaved();
render();
</script>
</body>
</html>
